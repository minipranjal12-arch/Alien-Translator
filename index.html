<!DOCTYPE html>
<html>
    <head>
        <title>Alien Language Translator</title>
        <link rel="stylesheet" href="style.css">

        <h1>Alien Language Translator</h1>
        <img src="Alien.png" alt="Alien" width="150" height="150">

                <h2>English</h2>

                </div>

             <script src="script.js"></script>
        </body>
    </html>
